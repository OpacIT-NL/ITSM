<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wachtwoord resetten</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
  <h1>Wachtwoord resetten</h1>
  <p>Hallo %firstname%,</p>
  <p>Er is een wachtwoordreset aangevraagd voor je ITSM SelfService-account.</p>
  <p>
    <a href="%reset_link%" style="display: inline-block; background: #2b6cd1; color: #ffffff; padding: 12px 18px; border-radius: 6px; text-decoration: none;">
      Wachtwoord opnieuw instellen
    </a>
  </p>
  <p>Deze link verloopt over %expires_minutes% minuten.</p>
  <p>Heb je dit niet aangevraagd? Dan kun je deze e-mail negeren.</p>
</body>
</html>
